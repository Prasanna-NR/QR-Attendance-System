{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><i class="fas fa-user-plus me-2"></i>Register</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label for="name" class="form-label">Full Name</label><input type="text" class="form-control" id="name" name="name" required></div>
                    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
                    <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" required minlength="6"></div>
                    <div class="mb-3"><label for="confirm_password" class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" required></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus me-2"></i>Register</button>
                </form>
                <div class="mt-3 text-center"><p>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
