{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><i class="fas fa-sign-in-alt me-2"></i>Login</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" required></div>
                    <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" class="form-control" id="password" name="password" required></div>
                    <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="remember" name="remember"><label class="form-check-label" for="remember">Remember Me</label></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
                </form>
                <div class="mt-3 text-center"><p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
