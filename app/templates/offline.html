<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - QR Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
        }
        .offline-card {
            max-width: 400px;
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .offline-icon {
            font-size: 80px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .retry-btn {
            border-radius: 30px;
            padding: 10px 40px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card offline-card shadow-lg">
        <div class="card-body">
            <i class="fas fa-wifi-slash offline-icon"></i>
            <h3 class="mb-3">You are Offline</h3>
            <p class="text-muted">Please check your internet connection and try again.</p>
            <p class="text-muted small">
                <i class="fas fa-info-circle me-1"></i>
                Your saved data will sync when you're back online.
            </p>
            <button onclick="location.reload()" class="btn btn-primary retry-btn">
                <i class="fas fa-sync me-2"></i>Retry
            </button>
            <div class="mt-3">
                <a href="/" class="text-decoration-none">
                    <i class="fas fa-home me-1"></i>Go to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
